# Site dedicado do flashcards (server_name exato tem precedência sobre o
# wildcard *.mnrs.com.br de mnrs.conf — nenhuma config de outro app muda).
# Instalação (root): copiar para /etc/nginx/sites-available/flashcards.conf,
# symlink em sites-enabled, `nginx -t` e reload.
server {
    listen 443 ssl http2;
    server_name flashcards.mnrs.com.br;
    ssl_certificate     /etc/ssl/cloudflare/mnrs.pem;
    ssl_certificate_key /etc/ssl/cloudflare/mnrs.key;

    # Upload de mídia: folga sobre MEDIA_MAX_BYTES (10 MiB) — o cap exato de
    # 10 MB continua sendo aplicado pela rota com 413 JSON (nginx default = 1m).
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3060;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
    error_page 502 503 504 =503 /__manutencao;
    location = /__manutencao { internal; root /var/www/manutencao; try_files /index.html =503; }
}

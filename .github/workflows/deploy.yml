name: Deploy

# Deploy em flashcards.mnrs.com.br (magalu, PM2), sem SSH e sem runner no Mac:
#
#   1. aqui, na VM do GitHub: lint, typecheck, testes e build (ci.yml);
#   2. verde: move a branch `live` para esse SHA (só avança, fast-forward);
#   3. no servidor: o auto-promote.timer (a cada minuto) vê a `live` andar e
#      roda `labctl promote flashcards <sha>` → scripts/deploy-magalu.sh do
#      próprio commit (deps, migrações, build, pm2), health em /api/health e
#      rollback automático se algo falhar;
#   4. aqui: espera o /api/health público responder com esse SHA.
#
# Funciona de qualquer aparelho: merge/push na main pelo celular basta.

on:
  push:
    branches: [main]
  # Revalida e libera a ponta da main de novo (ex.: a `live` não andou).
  workflow_dispatch:

concurrency:
  group: deploy-flashcards
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Testes
    uses: ./.github/workflows/ci.yml

  liberar:
    name: Liberar para o LIVE (branch live)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      # Pela API: o GitHub confere o fast-forward do lado dele (re-run de um
      # run antigo não faz a live voltar; rollback é revert na main).
      - name: Mover a live para o SHA validado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/live" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/live" \
              -f sha="${GITHUB_SHA}" -F force=false >/dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref=refs/heads/live -f sha="${GITHUB_SHA}" >/dev/null
          fi
          echo "live -> ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"

  aguardar:
    name: Esperar o servidor publicar
    needs: liberar
    runs-on: ubuntu-latest
    # Timer de 1 min + build (~1–2 min) + fila de outros apps no auto-promote.
    timeout-minutes: 25
    steps:
      - name: /api/health público com o SHA novo
        run: |
          set -u
          url=https://flashcards.mnrs.com.br/api/health
          while true; do
            no_ar="$(curl -fsS -m 10 "${url}" | jq -r '.commit // empty' 2>/dev/null || true)"
            if [ "${no_ar}" = "${GITHUB_SHA}" ]; then
              echo "No ar: ${no_ar}"
              break
            fi
            echo "Ainda em ${no_ar:-?}; esperando ${GITHUB_SHA:0:7}..."
            sleep 20
          done

      - name: Resumo
        if: always()
        run: |
          {
            echo "### Deploy flashcards.mnrs.com.br (magalu/PM2, auto-promote)"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Público: https://flashcards.mnrs.com.br/api/health"
            echo "- Se não publicou: \`ssh magalu journalctl -u auto-promote -n 80\` e \`labctl history flashcards\`"
          } >> "$GITHUB_STEP_SUMMARY"
